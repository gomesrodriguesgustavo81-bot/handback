<!DOCTYPE html>

<style>
  :root {
    color-scheme: light;
    --bg:#f8fafc; --surface:#fff; --border:#e2e8f0; --border2:#cbd5e1;
    --text:#0f172a; --text2:#334155; --muted:#64748b; --faint:#94a3b8; --primary:#0f172a;
    --exc-bg:#dcfce7; --exc-tx:#166534; --bom-bg:#dbeafe; --bom-tx:#1e40af;
    --reg-bg:#fef3c7; --reg-tx:#92400e; --ruim-bg:#fee2e2; --ruim-tx:#991b1b;
    --pend-bg:#f1f5f9; --pend-tx:#64748b;

    --azul-bg:#e0e7ff; --azul-tx:#3730a3; --lar-bg:#fff7ed; --lar-tx:#9a3412;
    --radius:14px; --nav-h:62px; --safe-b:env(safe-area-inset-bottom,0px);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--text); }
  body { font-family:'Segoe UI',Roboto,system-ui,-apple-system,sans-serif; font-size:15px; line-height:1.45; }
  button,select { font:inherit; color:inherit; }
  :focus-visible { outline:2px solid #6366f1; outline-offset:2px; }
  [hidden] { display:none !important; }
  .wrap { max-width:1100px; margin:0 auto; padding:0 16px; }

  header { position:sticky; top:0; z-index:10; background:rgba(248,250,252,.94); backdrop-filter:blur(8px); border-bottom:1px solid var(--border); }
  .topo { display:flex; align-items:center; gap:12px; padding:12px 0 8px; }
  .topo .t { flex:1; min-width:0; }
  .eyebrow { font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  h1 { margin:2px 0 0; font-size:19px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .icone { width:40px; height:40px; border-radius:12px; border:1px solid var(--border); background:var(--surface); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; flex:none; }
  .filtro { display:flex; gap:8px; align-items:center; padding-bottom:12px; }
  select { flex:1; min-width:0; appearance:none; -webkit-appearance:none; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:10px 12px; font-weight:600; font-size:14px; }
  .pill { font-size:12px; font-weight:700; border-radius:999px; padding:5px 10px; white-space:nowrap; display:inline-flex; align-items:center; }

  main.wrap { padding-top:16px; padding-bottom:calc(var(--nav-h) + 40px + var(--safe-b)); }
  .kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .kpi { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:12px; }
  .kpi .r { font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); }
  .kpi .v { font-size:24px; font-weight:800; margin-top:2px; }
  @media (max-width:420px) { .kpis { grid-template-columns:repeat(2,1fr); } }

  .titulo-secao { font-size:12px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:20px 0 10px; }
  .lista { display:grid; gap:12px; }
  @media (min-width:720px) { .lista { grid-template-columns:repeat(2,1fr); } }
  @media (min-width:1050px) { .lista { grid-template-columns:repeat(3,1fr); } }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; cursor:pointer; display:flex; flex-direction:column; gap:8px; }

  .linha { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .nome { font-weight:700; font-size:16px; }
  .sub { font-size:12.5px; color:var(--muted); }
  .rodape-card { display:flex; justify-content:space-between; align-items:center; gap:8px; padding-top:10px; border-top:1px solid var(--border); flex-wrap:wrap; }

  .b-EXCELENTE{background:var(--exc-bg);color:var(--exc-tx)} .b-BOM{background:var(--bom-bg);color:var(--bom-tx)}
  .b-REGULAR{background:var(--reg-bg);color:var(--reg-tx)} .b-RUIM{background:var(--ruim-bg);color:var(--ruim-tx)}
  .b-PENDENTE{background:var(--pend-bg);color:var(--pend-tx)}
  .badge { border-radius:999px; padding:4px 10px; font-size:11.5px; font-weight:800; letter-spacing:.05em; white-space:nowrap; }
  .st-sem{background:var(--pend-bg);color:var(--faint)} .st-rec{background:var(--azul-bg);color:var(--azul-tx)}
  .st-ana{background:var(--lar-bg);color:var(--lar-tx)} .st-apr{background:var(--azul-bg);color:var(--azul-tx)}
  .st-env{background:var(--ok-bg);color:var(--ok-tx)} .st-atr{background:var(--nao-bg);color:var(--nao-tx)}
  .sit-recebendo{background:var(--ok-bg);color:var(--ok-tx)} .sit-futura{background:var(--azul-bg);color:var(--azul-tx)}

  nav { position:fixed; left:0; right:0; bottom:0; z-index:20; height:calc(var(--nav-h) + var(--safe-b)); padding-bottom:var(--safe-b); background:var(--surface); border-top:1px solid var(--border); }

  .nav { flex:1; border:0; background:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:11.5px; font-weight:600; color:var(--faint); cursor:pointer; }

  .versao { text-align:center; font-size:11px; color:var(--faint); margin-top:28px; }

<script>
/* ===== Estado e utilitários ===== */
const E = { dados: null, aulaId: '', aba: 'painel', salvarPendente: null };
/** Link pessoal (vazio quando é o assistente). */
const TOKEN = /^[a-zA-Z0-9]*$/.test(document.body.dataset.k || '') ? (document.body.dataset.k || '') : '';
const $ = (id) => document.getElementById(id);

/** Chama o servidor. Fora do Google, explica como abrir corretamente. */
function api(nome, ...args) {
  return new Promise((ok, falha) => {
    if (!(window.google && google.script && google.script.run)) {
      return falha(new Error('Abra o app pelo link do Apps Script (termina em /dev ou /exec), não pelo arquivo no computador.'));
    }
    google.script.run
      .withSuccessHandler((txt) => { let r; try { r = JSON.parse(txt); } catch (e) { return falha(new Error('Resposta inválida do servidor.')); } r.ok ? ok(r.dados) : falha(new Error(r.erro)); })
      .withFailureHandler((e) => falha(new Error((e && e.message) || String(e)))).apiRun(TOKEN, nome, args);
  });
}

/** Cria elementos com segurança (texto sempre como texto). */
function h(tag, attrs, ...filhos) {
  const el = document.createElement(tag);
  Object.entries(attrs || {}).forEach(([k, v]) => {
    if (v === null || v === undefined || v === false) return;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  });
  filhos.flat(Infinity).forEach((f) => { if (f !== null && f !== undefined && f !== false) el.append(f.nodeType ? f : document.createTextNode(String(f))); });
  return el;
}

const CONCEITOS = ['EXCELENTE', 'BOM', 'REGULAR', 'RUIM'];
const badge = (c) => h('span', { class: 'badge b-' + (CONCEITOS.includes(c) ? c : 'PENDENTE') }, CONCEITOS.includes(c) ? c : 'PENDENTE');
const SIT = { recebendo: '● Recebendo entregas', futura: 'Ainda não começou', encerrada: 'Prazo encerrado', 'sem datas': 'Sem datas' };
const pillSit = (s) => h('span', { class: 'pill sit-' + (s === 'sem datas' ? 'sem' : s) }, SIT[s] || s);
const ICONE = { ENTREGUE: '✅', PARCIAL: '🟡', NAO_ENTREGUE: '❌' };

/** Situação de uma equipe numa aula, a partir da última entrega dela. */
function situacao(ent) {
  if (!ent) return { txt: 'Sem entrega', cls: 'st-sem' };
  const s = (ent.status || '').toLowerCase();
  if (s.startsWith('enviad') || s.startsWith('📨')) return { txt: '📨 Devolutiva enviada', cls: 'st-env' };
  if (s.startsWith('aprovad')) return { txt: '✅ Aprovada', cls: 'st-apr' };
  if (ent.conceito) return { txt: '⏳ Aguardando aprovação', cls: 'st-ana' };
  return { txt: '📥 Recebida', cls: 'st-rec' };
}

/** Substituídas, ignoradas e "possíveis" (ainda não confirmadas) não contam. */
const contaComoEntrega = (e) => !/substitu|ignorad|poss[ií]vel/i.test(e.status || '');

/** Última entrega da equipe naquela aula. */
function entregaDe(idEquipe, idAula) {
  const lista = E.dados.entregas.filter((e) => e.idEquipe === idEquipe && e.idAula === idAula && contaComoEntrega(e));
  return lista.length ? lista[lista.length - 1] : null;
}

/* ===== Carregar ===== */
async function carregar() {
  try {
    E.dados = await api('apiInicio');
    if (!E.aulaId || !E.dados.aulas.some((a) => a.id === E.aulaId)) {
      E.aulaId = E.dados.aulaDaVez || (E.dados.aulas[0] && E.dados.aulas[0].id) || '';
    }
    $('nav-ajustes').hidden = !(E.dados.usuario || {}).dono;
    const u = E.dados.usuario || {};
    $('versao').replaceChildren(
      h('div', null, '© ' + new Date().getFullYear() + ' · Avaliação Contínua de Entregas · Todos os direitos reservados'),
      h('div', { style: 'margin-top:2px' }, 'Conectado como ' + (u.nome || '?')));
    E.versaoTecnica = E.dados.versao + ' · App 12';
    carregarDrive();
    if (!E.agenda) carregarAgenda().catch(() => null);
    render();
    carregarTriagem();
  } catch (e) {
    $('titulo').textContent = 'Consultoria';
    $('lista').replaceChildren(h('div', { class: 'erro', style: 'grid-column:1/-1' }, '⚠️ ' + e.message));

/** ⟳ Recarrega tudo (painel, aulas, equipes, ajustes, "para confirmar") e avisa. */
async function atualizarTudo() {
  const b = $('btn-atualizar');
  if (b.disabled) return;
  b.disabled = true;
  b.classList.add('girando');
  try {
    if (E.salvarPendente) { try { await E.salvarPendente(); } catch (e) { /* aviso já mostrado */ } }
    await Promise.all([carregar(), E.gestao || E.aba !== 'painel' ? carregarGestao().catch(() => null) : null, carregarAgenda().catch(() => null)]);
    render();
    const agora = new Date();
    aviso('✅ Atualizado às ' + String(agora.getHours()).padStart(2, '0') + ':' + String(agora.getMinutes()).padStart(2, '0'));
  } catch (e) {
    aviso('Erro ao atualizar: ' + e.message, true);
  } finally {
    b.disabled = false;
    b.classList.remove('girando');
  }

function render() {
  if (E.aba === 'painel') renderPainel();

/* ===== Detalhe da equipe ===== */
function abrirEquipe(idEquipe) {
  const d = E.dados;
  const eq = d.equipes.find((x) => x.id === idEquipe);
  const aula = d.aulas.find((a) => a.id === E.aulaId);

  const secoes = [];

    secoes.push(h('ul', { class: 'itens' }, aula.itens.map((it) => {

      return h('li', null, h('span', { class: 'ic' }, c ? (ICONE[c.status] || '•') : '•'), h('span', null, it, c && c.evidencia ? h('span', { class: 'ev' }, c.evidencia) : null));

      secoes.push(h('div', { class: 'caixa' }, 'Enviada por ' + ent.remetente + ' em ' + ent.enviadoEm + (ent.atraso ? ' (com atraso)' : '') + '\n' + situacao(ent).txt), alvo);
      carregarDetalhes(ent.id, alvo);

  }

  secoes.push(h('div', { class: 'titulo-secao' }, 'Histórico da equipe'));

    return h('li', null,
      h('div', { class: 'linha' }, h('div', null, h('div', { style: 'font-weight:700' }, 'Aula ' + a.numero + ' — ' + a.titulo),
        h('div', { class: 'sub' }, 'Pedido: ' + a.itens.length + ' item(ns)  ·  ' + (e ? (e.checklist.length ? 'Entregue: ' + ok + '/' + total : 'Recebida em ' + e.enviadoEm) : (a.situacao === 'futura' ? 'Ainda não começou' : 'Sem entrega')))),
        badge(e && e.conceito)),
      e && e.evolucao ? h('div', { class: 'sub', style: 'margin-top:4px' }, e.evolucao) : null);

  secoes.push(h('div', { class: 'acoes-topo' },

  $('folha-corpo').replaceChildren(...secoes);
  $('fundo').classList.add('aberto');
  $('folha').classList.add('aberta');
  $('folha-corpo').scrollTop = 0;
}

async function carregarGestao() {

  return E.gestao;
}

/** Campo de formulário. tipo: texto | numero | data | longo | simnao | modo | status */
function campo(id, rotulo, valor, tipo, ajuda) {
  let el;
  if (tipo === 'longo') el = h('textarea', { id });
  else if (tipo === 'simnao' || tipo === 'modo' || tipo === 'status') {
    const ops = tipo === 'simnao' ? ['SIM', 'NÃO'] : tipo === 'modo' ? ['CONFIRMAR', 'AUTOMÁTICO'] : ['Planejada', 'Recebendo', 'Analisada', 'Concluída'];
    el = h('select', { id }, ops.map((o) => h('option', { value: o }, o)));
  } else el = h('input', { id, type: tipo === 'data' ? 'date' : tipo === 'numero' ? 'number' : 'text' });
  el.value = valor === undefined || valor === null ? '' : valor;
  if ((tipo === 'simnao' || tipo === 'modo') && !el.value) el.selectedIndex = 0;
  return h('div', { class: 'campo' }, h('label', { for: id }, rotulo), el, ajuda ? h('div', { class: 'ajuda' }, ajuda) : null);
}
const valor = (id) => ($(id) ? $(id).value : '');

function abrirFolha(titulo, conteudo) {
  E.salvarPendente = null;
  $('folha-titulo').textContent = titulo;
  $('folha-extra').replaceChildren();
  $('folha-corpo').replaceChildren(...conteudo.filter(Boolean));
  $('fundo').classList.add('aberto'); $('folha').classList.add('aberta');
  $('folha-corpo').scrollTop = 0;
}

async function salvarCom(btn, fn, okMsg) {
  btn.disabled = true;
  try {
    const r = await fn();
    await fechar();
    aviso(okMsg + (r && r.aviso ? '\n' + r.aviso : ''));
    await Promise.all([carregar(), carregarGestao()]);
    if (E.agenda) await carregarAgenda().catch(() => null);
    render();
    sincronizarAgendaSilencioso();
  } catch (e) { btn.disabled = false; aviso('Erro: ' + e.message, true); }
}

function confirmarAcao(titulo, texto, rotulo, fn) {
  $('camada-modal').replaceChildren(h('div', { class: 'modal-fundo' }, h('div', { class: 'modal', role: 'alertdialog', 'aria-modal': 'true' },

/**
 * Analisa uma por vez, com progresso. ⏹ Cancelar para NA HORA: a tela fecha,
 * as próximas não começam e o resultado da que estava em andamento é
 * descartado no servidor (nada é gravado).
 */
async function executarAnalise(fila) {
  const prontas = [];
  let cancelado = false;
  let liberar = null;
  E.analisando = true;
  const cancelar = () => {
    if (cancelado) return;
    cancelado = true;
    api('apiPendentesAnalise', 'cancelar').catch(() => {});
    if (liberar) liberar();
  };
  for (let i = 0; i < fila.length && !cancelado; i++) {
    const it = fila[i];
    carregando(true, '🤖 Analisando ' + (i + 1) + ' de ' + fila.length, it.equipe + ' · ' + it.aula + '\n(costuma levar de 20 s a 1 min)', prontas, cancelar);
    // Espera a análise OU o cancelamento (o que vier primeiro)
    const parar = new Promise((ok) => { liberar = () => ok({ parou: true }); });
    const resultado = await Promise.race([
      api('apiAnalisarUma', it.id).then((r) => ({ r }), (e) => ({ e })),
      parar
    ]);
    liberar = null;
    if (resultado.parou) break;
    if (resultado.r) prontas.push('✅ ' + resultado.r.equipe + ': ' + resultado.r.conceito + ' (' + resultado.r.segundos + ' s)');
    else if (!/^CANCELADA/.test(resultado.e.message)) prontas.push('❌ ' + it.equipe + ': ' + resultado.e.message.split('\n')[0]);
  }
  E.analisando = false;
  carregando(false);
  const feitas = prontas.filter((p) => p.startsWith('✅')).length;
  aviso(cancelado
    ? '⏹ Análise cancelada. ' + feitas + ' concluída(s) antes de cancelar; as demais continuam como "Recebida".' + (prontas.length ? '\n' + prontas.join('\n') : '')
    : '🤖 Análise concluída\n' + prontas.join('\n'), prontas.some((p) => p.startsWith('❌')));
  await carregar();
}

/* Se tentar fechar a página durante a análise, o navegador avisa. */
window.addEventListener('beforeunload', (ev) => { if (E.analisando) { ev.preventDefault(); ev.returnValue = ''; } });

async function reanalisar(id) {
  const eqId = E.dados.entregas.find((x) => x.id === id).idEquipe;
  try {
    let liberar;
    const parar = new Promise((ok) => { liberar = () => ok({ parou: true }); });
    carregando(true, '🤖 Analisando de novo…', '(costuma levar de 20 s a 1 min)', null,
      () => { api('apiPendentesAnalise', 'cancelar').catch(() => {}); liberar(); });
    const res = await Promise.race([api('apiReanalisar', id).then(() => ({}), (e) => ({ e })), parar]);
    carregando(false);
    if (res.parou) { aviso('⏹ Cancelado: a análise anterior foi mantida.'); return; }
    if (res.e) throw res.e;
    aviso('✅ Análise atualizada');
    await carregar();
    abrirEquipe(eqId);
  } catch (e) {
    carregando(false);
    aviso('Erro: ' + e.message, true);
  }
}

/* ===== Revisão e aprovação (Passo 5) ===== */
function blocoRevisao(d) {
  const info = E.dados.entregas.find((x) => x.id === d.id) || {};
  const enviada = /enviad/i.test(d.status);
  const aprovada = /^aprovad/i.test(d.status);
  const ind = h('span', { class: 'salvo' }, enviada ? '🔒 Enviada' : 'Salva automaticamente');
  const area = h('textarea', { class: 'fb', 'aria-label': 'Feedback à equipe' });
  area.value = d.feedback;
  let base = d.feedback, pendente = false, timer = null;
  const salvar = async () => {
    clearTimeout(timer);
    if (!pendente) return;
    pendente = false;
    const texto = area.value;
    ind.textContent = 'Salvando…';
    try {
      await api('apiSalvarFeedback', d.id, texto, base);
      base = texto;
      ind.textContent = 'Salvo ✓';
    } catch (e) {
      ind.textContent = '⚠️ Não salvo';
      if (/^CONFLITO/.test(e.message)) aviso(e.message.replace(/^CONFLITO:\s*/, ''), true);
      else { pendente = true; aviso('Erro ao salvar: ' + e.message, true); }
      throw e;
    }
  };
  if (enviada) area.readOnly = true;
  else {

const DIAS_SEMANA = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
const dataLocal = (iso) => { const [a, m, d] = iso.split('-').map(Number); return new Date(a, m - 1, d); };
const diaSemana = (iso) => DIAS_SEMANA[dataLocal(iso).getDay()] + ', ' + iso.split('-').reverse().slice(0, 2).join('/');
const hojeIso = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
function emDias(iso) {
  const n = Math.round((dataLocal(iso) - dataLocal(hojeIso())) / 864e5);
  return n === 0 ? 'hoje' : n === 1 ? 'amanhã' : n === -1 ? 'ontem' : n > 0 ? 'em ' + n + ' dias' : 'há ' + (-n) + ' dias';
}

/** Situação de cada equipe na aula, para os chips da agenda. */
function chipsEquipes(aula) {
  const hoje = hojeIso();
  const prazoPassou = aula.recebeAte && aula.recebeAte < hoje;
  return E.dados.equipes.map((q) => {
    const ent = entregaDe(q.id, aula.id);
    let txt, cls;
    if (!ent) { txt = prazoPassou ? '❌ ' + q.nome : '⏳ ' + q.nome; cls = prazoPassou ? 'st-atr' : 'st-sem'; }
    else if (/^(📨|enviad)/i.test(ent.status)) { txt = '📨 ' + q.nome; cls = 'st-env'; }
    else if (ent.atraso) { txt = '⚠️ ' + q.nome + ' (atraso)'; cls = 'st-ana'; }
    else { txt = '✅ ' + q.nome; cls = 'st-rec'; }
    return h('span', { class: 'pill ' + cls, title: ent ? situacao(ent).txt : 'Sem entrega' }, txt);
  });
}

async function renderAgenda() {
  $('eyebrow').textContent = 'Calendário';
  $('titulo').textContent = 'Agenda';
  if (!E.agenda) {
    $('lista-agenda').replaceChildren(h('div', { class: 'esq' }), h('div', { class: 'esq' }));
    try { await carregarAgenda(); } catch (e) { return $('lista-agenda').replaceChildren(h('div', { class: 'erro' }, e.message)); }
  }
  const g = E.agenda, hoje = hojeIso();
  const nEquipes = E.dados.equipes.length;

  // Próximos compromissos
  const marcos = [];
  g.aulas.forEach((a) => {
    const nome = 'Aula ' + a.numero + (a.titulo ? ' — ' + a.titulo : '');
    if (a.dataAula) marcos.push({ dia: a.dataAula, txt: '📚 ' + nome, aula: a });
    if (a.recebeAte) marcos.push({ dia: a.recebeAte, txt: '⏰ Prazo de entrega · ' + nome, aula: a });
    if (a.devolutivaAte) marcos.push({ dia: a.devolutivaAte, txt: '📝 Devolutivas · ' + nome, aula: a });
  });
  (g.extras || []).forEach((x) => marcos.push({ dia: x.data, txt: '📌 ' + x.titulo, extra: x }));
  const prox = marcos.filter((m) => m.dia >= hoje).sort((x, y) => (x.dia < y.dia ? -1 : x.dia > y.dia ? 1 : 0)).slice(0, 3);

  const topo = [];
  if (g.dono) {
    if (!g.criada) {
      const totalAlunos = E.dados.equipes.reduce((t, q) => t + (q.emails || []).length, 0);

      topo.push(h('div', { class: 'bloco' }, h('h3', null, '📅 Google Agenda'),
        h('div', { class: 'sub' }, 'Coloque as aulas, os prazos de entrega e os dias de devolutiva no Google Agenda de todo mundo. Depois, qualquer mudança de data no app atualiza a agenda sozinha.'),
        h('div', { class: 'sub', style: 'margin-top:6px' }, 'Antes, confira o horário das aulas em ⚙️ Ajustes da agenda.'),

    } else {
      const b = h('button', { class: 'btn' }, '🔄 Atualizar agenda');
      b.addEventListener('click', () => sincronizarAgenda(b, false));
      topo.push(h('div', { class: 'bloco' }, h('h3', null, '📅 Google Agenda'),
        h('div', { class: 'sub', style: 'margin-bottom:10px' }, 'Convites enviados a professores' + (/^n/i.test(g.config.convidarEquipes) ? '' : ' e equipes') + '.' + (g.sincronizadaEm ? ' Atualizada em ' + g.sincronizadaEm + '.' : '')),
        h('div', { class: 'pilha' }, h('a', { class: 'btn', href: g.url, target: '_blank', rel: 'noopener' }, '📅 Abrir no Google Agenda'), b,
          h('button', { class: 'btn', onclick: ajustesAgenda }, '⚙️ Ajustes da agenda'))));
    }
  } else {
    topo.push(h('div', { class: 'sub', style: 'margin-bottom:12px' }, g.criada ? '📅 Estas datas também estão no seu Google Agenda (chegaram como convite por e-mail).' : '📅 Datas das aulas, prazos e devolutivas.'));
  }
  if (prox.length) {
    topo.push(h('div', { class: 'ag-prox' }, h('b', null, 'Próximos'), prox.map((m) => h('div', null, diaSemana(m.dia) + ' (' + emDias(m.dia) + ') — ' + m.txt))));
  }
  $('agenda-topo').replaceChildren(...topo);
  E.marcosAgenda = marcos;
  renderCalendarioMes();

  const comData = g.aulas.filter((a) => a.dataAula || a.recebeAte);
  const ordenar = (a) => a.dataAula || a.recebeAte;
  comData.sort((x, y) => (ordenar(x) < ordenar(y) ? -1 : 1));
  const semData = g.aulas.filter((a) => !a.dataAula && !a.recebeAte);
  const linhaData = (rot, iso, extra, lembrete) => iso ? h('div', { class: 'd' + (lembrete ? ' lembrete' : '') }, h('b', null, diaSemana(iso)), h('span', null, rot + (extra || '') + ' · ' + emDias(iso))) : null;

  $('lista-agenda').replaceChildren(...comData.map((a) => {
    const ativa = (a.recebeDe || a.dataAula || '') <= hoje && hoje <= (a.devolutivaAte || a.recebeAte || a.dataAula || '');

/** Calendário mensal: cada dia mostra as aulas (azul), prazos (vermelho) e devolutivas (laranja). */
const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
function renderCalendarioMes() {
  const hoje = hojeIso();
  if (!E.mesAg) { const d = new Date(); E.mesAg = { a: d.getFullYear(), m: d.getMonth() }; E.diaAg = hoje; }
  const { a, m } = E.mesAg;
  const iso = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const porDia = {};
  (E.marcosAgenda || []).forEach((x) => { (porDia[x.dia] = porDia[x.dia] || []).push(x); });
  const tipo = (x) => (x.extra ? 'extra' : x.txt.startsWith('📚') ? 'aula' : x.txt.startsWith('⏰') ? 'prazo' : 'dev');
  const curto = (x) => (x.extra ? '📌 ' + x.extra.titulo : ({ aula: '📚 ', prazo: '⏰ ', dev: '📝 ' }[tipo(x)]) + 'A' + x.aula.numero);
  const mudar = (n) => { const d = new Date(a, m + n, 1); E.mesAg = { a: d.getFullYear(), m: d.getMonth() }; renderCalendarioMes(); };

  const inicio = new Date(a, m, 1); inicio.setDate(1 - inicio.getDay());
  const dias = [];
  for (let i = 0; i < 42; i++) {
    const d = new Date(inicio.getFullYear(), inicio.getMonth(), inicio.getDate() + i);
    if (i === 35 && d.getMonth() !== m) break;
    const k = iso(d), evs = porDia[k] || [];
    dias.push(h('button', { class: 'cal-dia' + (d.getMonth() !== m ? ' fora' : '') + (k === hoje ? ' hoje' : '') + (k === E.diaAg ? ' sel' : ''),
      'aria-label': d.getDate() + ' de ' + MESES[d.getMonth()] + (evs.length ? ', ' + evs.length + ' compromisso(s)' : ''),
      onclick: () => { E.diaAg = k; if (d.getMonth() !== m) E.mesAg = { a: d.getFullYear(), m: d.getMonth() }; renderCalendarioMes(); } },
      h('span', { class: 'n' }, d.getDate()),
      evs.slice(0, 3).map((x) => h('span', { class: 'ev ev-' + tipo(x) }, curto(x))),
      evs.length > 3 ? h('span', { class: 'ev' }, '+' + (evs.length - 3)) : null));
  }
  const sel = (porDia[E.diaAg] || []);
  const cfg = (E.agenda && E.agenda.config) || {};
  const detalhe = h('div', { class: 'cal-detalhe' },
    h('div', { style: 'font-weight:700;margin-bottom:2px' }, E.diaAg ? diaSemana(E.diaAg) + ' · ' + emDias(E.diaAg) : ''),
    sel.length ? sel.map((x) => {
      const t = tipo(x);
      const sub = t === 'aula' ? (cfg.horario || 'Dia inteiro') : t === 'prazo' ? 'Entregas até ' + (cfg.horaPrazo || '23:59')
        : t === 'dev' ? 'Revisar, aprovar e enviar (interno) · muda junto com o prazo'
        : (x.extra.horario || 'Dia inteiro') + ' · ' + (x.extra.para === 'professores' ? 'só professores' : 'para todos') + (x.extra.obs ? ' · ' + x.extra.obs : '');
      const parar = (fn) => (ev) => { ev.stopPropagation(); fn(); };
      return h('div', { class: 'item', tabindex: '0', onclick: () => { if (x.aula) { E.aulaId = x.aula.id; irPara('painel'); } else editarExtra(x.extra); } },
        h('span', { class: 'ev ev-' + t, style: 'font-size:12px;padding:3px 6px' }, { aula: 'Aula', prazo: 'Prazo', dev: 'Devolutiva', extra: 'Outro' }[t]),
        h('div', { style: 'flex:1;min-width:0' }, h('div', { style: 'font-weight:600' }, x.txt.replace(/^\S+\s/, '')), h('div', { class: 'sub' }, sub)),
        t === 'dev' ? null : h('div', { class: 'cal-acoes' },
          h('button', { class: 'btn btn-peq', 'aria-label': 'Mudar o dia', onclick: parar(() => (x.extra ? editarExtra(x.extra) : mudarDia(x.aula, t))) }, '📅'),
          h('button', { class: 'btn btn-peq btn-perigo', 'aria-label': 'Tirar da agenda', onclick: parar(() => tirarDia(x)) }, '✕')));
    }) : h('div', { class: 'sub' }, 'Nada marcado neste dia.'),
    h('button', { class: 'btn', style: 'width:100%;margin-top:10px', onclick: () => adicionarNoDia(E.diaAg) }, '+ Pôr algo neste dia'));

  $('agenda-cal').replaceChildren(h('div', { class: 'cal' },
    h('div', { class: 'cal-cab' },
      h('button', { class: 'icone', 'aria-label': 'Mês anterior', onclick: () => mudar(-1) }, '‹'),
      h('b', null, MESES[m] + ' ' + a),
      h('button', { class: 'icone', 'aria-label': 'Próximo mês', onclick: () => mudar(1) }, '›')),
    h('div', { class: 'cal-grade' }, ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'].map((s) => h('div', { class: 'cal-sem' }, s)), dias),
    h('div', { class: 'cal-leg' },
      h('span', null, h('i', { class: 'ev-aula' }), 'Aula'), h('span', null, h('i', { class: 'ev-prazo' }), 'Prazo de entrega'),
      h('span', null, h('i', { class: 'ev-dev' }), 'Devolutivas'),
      h('span', null, h('i', { class: 'ev-extra' }), 'Outros'),
      E.mesAg.a !== new Date().getFullYear() || E.mesAg.m !== new Date().getMonth()
        ? h('button', { class: 'link-btn', onclick: () => { E.mesAg = null; renderCalendarioMes(); } }, 'Hoje') : null),
    detalhe));
}

/* --- Pôr e tirar dias pelo calendário --- */
const nomeAula = (a) => 'Aula ' + a.numero + (a.titulo ? ' — ' + a.titulo : '');
const NOME_CAMPO = { aula: 'o dia da aula', prazo: 'o prazo de entrega' };

async function gravarAgenda(promessa, okMsg) {
  try {
    const r = await promessa;
    aviso(okMsg + (r && r.agenda && (r.agenda.criados || r.agenda.atualizados || r.agenda.removidos) ? '\n📅 Google Agenda atualizado' : ''));
    await Promise.all([carregar(), carregarAgenda(), E.gestao ? carregarGestao() : null]);
    renderAgenda();
  } catch (e) { aviso('Erro: ' + e.message, true); }
}

function mudarDia(aula, campo) {
  const atual = campo === 'aula' ? aula.dataAula : aula.recebeAte;
  const inp = h('input', { type: 'date', id: 'md-data', style: 'width:100%' }); inp.value = atual || E.diaAg || '';
  $('camada-modal').replaceChildren(h('div', { class: 'modal-fundo' }, h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true' },
    h('h3', null, '📅 Mudar ' + NOME_CAMPO[campo]), h('div', { class: 'sub', style: 'margin-bottom:10px' }, nomeAula(aula)),
    h('div', { class: 'campo' }, inp),
    h('div', { class: 'botoes' }, h('button', { class: 'btn', onclick: fecharModal }, 'Cancelar'),
      h('button', { class: 'btn btn-prim', onclick: () => { const v = inp.value; if (!v) return aviso('Escolha a data.', true); fecharModal(); E.diaAg = v; E.mesAg = { a: +v.slice(0, 4), m: +v.slice(5, 7) - 1 };
        gravarAgenda(api('apiAgendaData', aula.id, campo, v), '✅ ' + nomeAula(aula) + ': ' + NOME_CAMPO[campo] + ' agora é ' + diaSemana(v)); } }, 'Salvar')))));
}

function tirarDia(x) {
  if (x.extra) {
    return confirmarAcao('Tirar "' + x.extra.titulo + '"?', 'Sai do calendário do app e do Google Agenda de todos.', 'Tirar',
      () => gravarAgenda(api('apiAgendaExtra', 'excluir', { id: x.extra.id }), '✅ Compromisso tirado'));
  }
  const campo = x.txt.startsWith('📚') ? 'aula' : 'prazo';
  confirmarAcao('Tirar ' + NOME_CAMPO[campo] + '?', nomeAula(x.aula) + ' fica sem essa data (sai do Google Agenda de todos). A aula e as entregas continuam no app.' +
    (campo === 'prazo' ? ' Sem prazo, a busca não marca atraso e não há lembrete de devolutiva.' : ''), 'Tirar',
    () => gravarAgenda(api('apiAgendaData', x.aula.id, campo, ''), '✅ Data tirada'));
}

/** "+ Pôr algo neste dia": nova aula, mover aula/prazo para cá ou compromisso avulso. */
function adicionarNoDia(dia) {
  if (!dia) return aviso('Toque num dia do calendário primeiro.', true);
  const aulas = (E.agenda && E.agenda.aulas) || [];
  const sel = h('select', { id: 'ad-oque', style: 'width:100%' },
    h('option', { value: 'extra' }, '📌 Outro compromisso (feriado, reunião, sem aula…)'),
    h('option', { value: 'nova' }, '📚 Nova aula neste dia'),
    aulas.length ? h('optgroup', { label: 'Mudar para este dia' },
      aulas.map((a) => h('option', { value: 'aula|' + a.id }, '📚 Dia da ' + nomeAula(a) + (a.dataAula ? ' (agora em ' + br(a.dataAula).slice(0, 5) + ')' : ' (sem data)'))),
      aulas.map((a) => h('option', { value: 'prazo|' + a.id }, '⏰ Prazo da ' + nomeAula(a) + (a.recebeAte ? ' (agora em ' + br(a.recebeAte).slice(0, 5) + ')' : ' (sem data)')))) : null);
  const extras = h('div', null,
    campo('ad-tit', 'Nome', '', 'texto', 'Ex.: Feriado — sem aula · Reunião com o professor · Banca final'),
    campo('ad-hor', 'Horário (opcional)', '', 'texto', 'Ex.: 14:00-15:00. Vazio = dia inteiro.'),
    h('div', { class: 'campo' }, h('label', { for: 'ad-para' }, 'Quem vê'),
      h('select', { id: 'ad-para' }, h('option', { value: 'todos' }, 'Todos (professores e alunos)'), h('option', { value: 'professores' }, 'Só professores'))),
    campo('ad-obs', 'Observação (opcional)', '', 'texto'));
  sel.addEventListener('change', () => { extras.hidden = sel.value !== 'extra'; });
  const ok = h('button', { class: 'btn btn-prim' }, 'Pôr na agenda');
  ok.addEventListener('click', () => {
    const v = sel.value;
    if (v === 'extra') {
      if (!valor('ad-tit').trim()) return aviso('Dê um nome ao compromisso.', true);
      const dados = { data: dia, titulo: valor('ad-tit'), horario: valor('ad-hor'), para: valor('ad-para'), obs: valor('ad-obs') };
      fecharModal();
      return gravarAgenda(api('apiAgendaExtra', 'salvar', dados), '✅ "' + dados.titulo + '" na agenda');
    }
    fecharModal();
    if (v === 'nova') return novaAulaNoDia(dia);
    const [campoX, id] = v.split('|');
    const a = aulas.find((x) => x.id === id);
    gravarAgenda(api('apiAgendaData', id, campoX, dia), '✅ ' + nomeAula(a) + ': ' + NOME_CAMPO[campoX] + ' agora é ' + diaSemana(dia));
  });
  $('camada-modal').replaceChildren(h('div', { class: 'modal-fundo' }, h('div', { class: 'modal form', role: 'dialog', 'aria-modal': 'true', style: 'max-width:520px' },
    h('h3', null, '+ ' + diaSemana(dia)), h('div', { class: 'campo' }, h('label', { for: 'ad-oque' }, 'O que você quer pôr neste dia?'), sel), extras,
    h('div', { class: 'botoes' }, h('button', { class: 'btn', onclick: fecharModal }, 'Cancelar'), ok))));
}

function editarExtra(x) {
  const ok = h('button', { class: 'btn btn-prim' }, 'Salvar');
  ok.addEventListener('click', () => {
    const dados = { id: x.id, data: valor('ex-data'), titulo: valor('ex-tit'), horario: valor('ex-hor'), para: valor('ex-para'), obs: valor('ex-obs') };
    if (!dados.data) return aviso('Escolha a data.', true);
    fecharModal(); E.diaAg = dados.data; E.mesAg = { a: +dados.data.slice(0, 4), m: +dados.data.slice(5, 7) - 1 };
    gravarAgenda(api('apiAgendaExtra', 'salvar', dados), '✅ Compromisso salvo');
  });
  const para = h('select', { id: 'ex-para' }, h('option', { value: 'todos' }, 'Todos (professores e alunos)'), h('option', { value: 'professores' }, 'Só professores'));
  para.value = x.para;
  $('camada-modal').replaceChildren(h('div', { class: 'modal-fundo' }, h('div', { class: 'modal form', role: 'dialog', 'aria-modal': 'true', style: 'max-width:520px' },
    h('h3', null, '📌 ' + x.titulo),
    campo('ex-data', 'Dia', x.data, 'data'), campo('ex-tit', 'Nome', x.titulo, 'texto'), campo('ex-hor', 'Horário (opcional)', x.horario, 'texto', 'Vazio = dia inteiro.'),
    h('div', { class: 'campo' }, h('label', { for: 'ex-para' }, 'Quem vê'), para), campo('ex-obs', 'Observação', x.obs, 'texto'),
    h('div', { class: 'botoes' }, h('button', { class: 'btn btn-perigo', onclick: () => { fecharModal(); tirarDia({ extra: x }); } }, 'Tirar'),
      h('button', { class: 'btn', onclick: fecharModal }, 'Cancelar'), ok))));
}

/** Nova aula já com a data; o prazo segue o intervalo usado nas outras aulas (ou 4 dias). */
function novaAulaNoDia(dia) {
  const aulas = (E.agenda && E.agenda.aulas) || [];
  const ref = aulas.filter((a) => a.dataAula && a.recebeAte).pop();
  const gap = ref ? Math.round((dataLocal(ref.recebeAte) - dataLocal(ref.dataAula)) / 864e5) : 4;
  const d = dataLocal(dia); d.setDate(d.getDate() + gap);
  const ate = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const abrir = () => editarAula(null, { dataAula: dia, recebeDe: dia, recebeAte: ate });
  if (E.gestao) abrir(); else carregarGestao().then(abrir).catch((e) => aviso('Erro: ' + e.message, true));
}

async function sincronizarAgenda(btn, criar) {
  btn.disabled = true;
  const txt = btn.textContent;
  btn.textContent = '⏳ Atualizando o Google Agenda…';
  try {
    const r = await api('apiSincronizarAgenda', { criar: !!criar });
    if (r.ocupado) aviso('A agenda já está sendo atualizada; tente em instantes.');
    else aviso('📅 ' + (criar ? 'Agenda criada! ' : '') + r.criados + ' evento(s) novo(s), ' + r.atualizados + ' atualizado(s)' + (r.removidos ? ', ' + r.removidos + ' removido(s)' : '') +
      (r.restantes ? '\nFaltam ' + r.restantes + ': toque em Atualizar de novo.' : '') + (r.falhas && r.falhas.length ? '\n❌ ' + r.falhas.join('\n') : ''), r.falhas && r.falhas.length > 0);
    await carregarAgenda();
    renderAgenda();
  } catch (e) {
    const perm = /permission|permiss/i.test(e.message);
    aviso(perm ? '🔐 Falta autorizar o Google Agenda: no editor do Apps Script, escolha a função "autorizarAgenda", toque em ▶ Executar e aceite. Depois tente de novo.' : 'Erro: ' + e.message, true);
    btn.disabled = false; btn.textContent = txt;
  }
}

function ajustesAgenda() {
  const c = E.agenda.config;
  const btn = h('button', { class: 'btn btn-prim', style: 'flex:1' }, 'Salvar');
  btn.addEventListener('click', async () => {
    btn.disabled = true;
    try {
      await api('apiConfigAgenda', { horario: valor('ag-hor'), horaPrazo: valor('ag-prazo'), diasDevolutiva: valor('ag-dias'), convidarEquipes: valor('ag-conv') });
      await fechar();
      aviso('✅ Ajustes da agenda salvos');
      await carregarAgenda();
      renderAgenda();
      sincronizarAgendaSilencioso();
    } catch (e) { btn.disabled = false; aviso('Erro: ' + e.message, true); }
  });
  abrirFolha('Ajustes da agenda', [
    h('div', { class: 'form', style: 'margin-top:12px' },
      campo('ag-hor', 'Horário das aulas', c.horario, 'texto', 'Ex.: 19:00-22:00. Deixe vazio para eventos de dia inteiro.'),
      campo('ag-prazo', 'Hora-limite das entregas', c.horaPrazo || '23:59', 'texto', 'No dia "Recebe entregas até" de cada aula.'),

}

/* ===== Passo 12: automático, cobrança, cópias e fechamento ===== */
const SIMNAO_AUTO = [
  ['AUTO_BUSCAR', '📥 Buscar entregas de hora em hora'],
  ['AUTO_ANALISAR', '🤖 Analisar com a IA o que chegar (nada é enviado sem aprovação)'],
  ['AUTO_RESUMO_PROFESSORES', '📬 Resumo diário por e-mail (professores e você)'],
  ['AUTO_LEMBRETE_PRAZO', '⏰ Lembrete às equipes na véspera do prazo (só quem não entregou)'],
  ['AUTO_BACKUP', '💾 Cópia de segurança toda segunda-feira']
];

async function renderAutomacao(r) {
  const alvo = $('bloco-auto');
  if (!alvo) return;
  try { r = r || await api('apiAutomacao', 'estado'); } catch (e) { return alvo.replaceChildren(h('h3', null, '🤖 Modo automático'), h('div', { class: 'erro' }, permissaoOuErro(e, 'autorizarAutomacao'))); }
  const c = r.config;
  const acao = async (btn, nome, msg) => {
    btn.disabled = true;
    try { const x = await api('apiAutomacao', nome); aviso(msg(x)); await renderAutomacao(nome === 'rodar' ? null : x); if (nome === 'rodar') { await carregar(); } }
    catch (e) { aviso(permissaoOuErro(e, 'autorizarAutomacao'), true); btn.disabled = false; }
  };
  const bLiga = h('button', { class: 'btn ' + (r.ligado ? '' : 'btn-prim') }, r.ligado ? '⏸️ Desligar o modo automático' : '▶️ Ligar o modo automático');
  bLiga.addEventListener('click', () => acao(bLiga, r.ligado ? 'desligar' : 'ligar', (x) => x.ligado ? '🤖 Modo automático ligado: roda de hora em hora' : 'Modo automático desligado'));
  const bRodar = h('button', { class: 'btn' }, '⚡ Rodar agora');
  bRodar.addEventListener('click', () => { bRodar.textContent = '⏳ Rodando… (pode levar alguns minutos)'; acao(bRodar, 'rodar', (x) => '🤖 ' + x.resumo); });
  const salvar = h('button', { class: 'btn btn-prim', style: 'width:100%' }, 'Salvar ajustes do automático');
  salvar.addEventListener('click', async () => {
    salvar.disabled = true;
    const v = Object.fromEntries(SIMNAO_AUTO.map(([k]) => [k, valor('au-' + k)]));
    Object.assign(v, { AUTO_HORA_DIARIA: valor('au-hora'), BACKUPS_MANTER: valor('au-manter'), TEXTO_LEMBRETE: valor('au-lemb'), TEXTO_COBRANCA: valor('au-cob') });
    try { const x = await api('apiAutomacao', 'salvar', v); aviso('✅ Ajustes salvos'); renderAutomacao(x); } catch (e) { aviso('Erro: ' + e.message, true); salvar.disabled = false; }
  });
  const det = h('details', { style: 'margin-top:12px' }, h('summary', { style: 'cursor:pointer;font-weight:600' }, '⚙️ O que o automático faz'),
    h('div', { class: 'form', style: 'margin-top:10px' },
      SIMNAO_AUTO.map(([k, rot]) => campo('au-' + k, rot, /^n/i.test(c[k]) ? 'NÃO' : 'SIM', 'simnao')),
      h('div', { class: 'grade2' }, campo('au-hora', 'Hora das tarefas diárias', c.AUTO_HORA_DIARIA, 'numero', 'De 0 a 23.'), campo('au-manter', 'Cópias a guardar', c.BACKUPS_MANTER, 'numero')),
      campo('au-lemb', 'Texto do lembrete da véspera', c.TEXTO_LEMBRETE, 'longo', 'Campos: {equipe} {aula} {prazo} {itens} {email} {assunto} {professor}'),
      campo('au-cob', 'Texto da cobrança', c.TEXTO_COBRANCA, 'longo', 'Os mesmos campos. Você revisa antes de cada envio.'), salvar));
  alvo.replaceChildren(h('h3', null, '🤖 Modo automático'),
    h('div', { class: 'linha', style: 'margin:4px 0 10px' }, h('span', { class: 'pill ' + (r.ligado ? 'sit-recebendo' : 'sit-sem') }, r.ligado ? '● Ligado: de hora em hora' : 'Desligado'),
      r.ultima ? h('span', { class: 'sub' }, 'Última vez: ' + r.ultima) : null),
    r.resumo ? h('div', { class: 'caixa', style: 'margin-bottom:10px;font-size:13px' }, r.resumo) : null,
    h('div', { class: 'sub', style: 'margin-bottom:10px' }, 'Busca, salva no Drive e analisa sozinho; uma vez por dia manda o resumo, os lembretes de prazo e (às segundas) faz a cópia de segurança. Devolutivas continuam precisando de aprovação e do seu envio.'),
    h('div', { class: 'pilha' }, bLiga, bRodar), det);
}

/** Mensagem amigável quando falta autorizar no editor. */
function permissaoOuErro(e, funcao) {
  return /permission|permiss|autoriza/i.test(e.message)
    ? '🔐 Falta autorizar: no editor do Apps Script, escolha a função "' + funcao + '", toque em ▶ Executar e aceite. Depois tente de novo.'
    : 'Erro: ' + e.message;
}

async function renderBackup(r) {
  const alvo = $('bloco-backup');
  if (!alvo) return;
  try { r = r || await api('apiBackup', 'listar'); } catch (e) { return alvo.replaceChildren(h('h3', null, '💾 Cópias de segurança'), h('div', { class: 'erro' }, permissaoOuErro(e, 'autorizarAutomacao'))); }
  const b = h('button', { class: 'btn' }, '💾 Fazer uma cópia agora');
  b.addEventListener('click', async () => {
    b.disabled = true; b.textContent = '⏳ Copiando a planilha…';
    try { const x = await api('apiBackup', 'agora'); aviso('💾 Cópia criada: ' + x.nova.nome); renderBackup(x); } catch (e) { aviso(permissaoOuErro(e, 'autorizarAutomacao'), true); b.disabled = false; b.textContent = '💾 Fazer uma cópia agora'; }
  });
  alvo.replaceChildren(h('h3', null, '💾 Cópias de segurança'),
    h('div', { class: 'sub', style: 'margin-bottom:10px' }, 'Cópia completa da planilha no seu Drive. Se algo for apagado por engano, é só abrir a cópia e copiar de volta.'),
    h('div', { class: 'pilha' }, b, h('a', { class: 'btn', href: r.pasta, target: '_blank', rel: 'noopener' }, '📁 Abrir a pasta das cópias')),
    r.copias.length ? h('div', { style: 'margin-top:10px' }, r.copias.slice(0, 5).map((c) => h('div', { class: 'prof' },
      h('div', null, h('div', { style: 'font-weight:600' }, c.em), h('div', { class: 'sub' }, c.nome)),
      h('a', { class: 'btn btn-peq', href: c.url, target: '_blank', rel: 'noopener' }, 'Abrir')))) : h('div', { class: 'sub', style: 'margin-top:8px' }, 'Nenhuma cópia ainda.'));
}

/** 📣 Cobrar quem não entregou: escolhe as equipes e revisa o texto antes. */
async function abrirCobranca(aula) {
  let r;
  try { r = await api('apiCobranca', 'previa', aula.id); } catch (e) { return aviso('Erro: ' + e.message, true); }
  if (!r.equipes.length) return aviso('Todas as equipes já entregaram esta aula. ✅');
  const marcas = r.equipes.map((q) => { const c = h('input', { type: 'checkbox', value: q.id }); c.checked = !!q.emails && !q.cobradaEm; if (!q.emails) c.disabled = true; return c; });
  const assunto = h('input', { type: 'text', id: 'cb-assunto' }); assunto.value = r.assunto;
  const texto = h('textarea', { id: 'cb-texto', style: 'min-height:220px' }); texto.value = r.texto;
  const salvarTexto = h('input', { type: 'checkbox', id: 'cb-salvar' });
  const enviar = h('button', { class: 'btn btn-prim', style: 'flex:1' }, '📣 Enviar cobrança');
  enviar.addEventListener('click', async () => {
    const ids = marcas.filter((m) => m.checked).map((m) => m.value);
    if (!ids.length) return aviso('Marque pelo menos uma equipe.', true);
    enviar.disabled = true; enviar.textContent = '⏳ Enviando…';
    try {
      const x = await api('apiCobranca', 'enviar', aula.id, { ids, assunto: assunto.value, texto: texto.value, salvarTexto: salvarTexto.checked });
      await fechar();
      aviso('📣 Cobrança enviada para ' + x.enviados.join(', ') + (x.falhas.length ? '\n❌ ' + x.falhas.join('\n') : ''), x.falhas.length > 0);
    } catch (e) { aviso('Erro: ' + e.message, true); enviar.disabled = false; enviar.textContent = '📣 Enviar cobrança'; }
  });
  abrirFolha('📣 Cobrar: ' + r.aula, [
    h('div', { class: 'sub', style: 'margin:12px 0 6px' }, 'Equipes sem entrega nesta aula. Cada equipe recebe um e-mail só dela, saindo da sua conta.'),
    h('div', { class: 'bloco', style: 'padding:8px 14px' }, r.equipes.map((q, i) => h('label', { class: 'prof', style: 'cursor:pointer' },
      h('span', { style: 'display:flex;gap:10px;align-items:center;font-weight:600' }, marcas[i], q.nome),
      h('span', { class: 'sub' }, !q.emails ? 'sem e-mail cadastrado' : q.cobradaEm ? 'já cobrada em ' + q.cobradaEm : q.emails + ' integrante(s)')))),
    h('div', { class: 'form' },
      h('div', { class: 'campo' }, h('label', { for: 'cb-assunto' }, 'Assunto'), assunto),
      h('div', { class: 'campo' }, h('label', { for: 'cb-texto' }, 'Texto'), texto,
        h('div', { class: 'ajuda' }, '{equipe}, {itens}, {assunto} etc. são trocados para cada equipe. Exemplo de como fica:')),
      h('div', { class: 'caixa', style: 'font-size:13px' }, r.exemplo),
      h('label', { for: 'cb-salvar', style: 'display:flex;gap:8px;align-items:center;font-weight:600;margin-top:10px' }, salvarTexto, 'Usar este texto nas próximas cobranças')),
    h('div', { class: 'acoes-topo' }, enviar)]);
}

/** 🏁 Fechamento do curso de uma equipe. */
async function abrirFechamento(idEquipe) {
  abrirFolha('🏁 Fechamento do curso', [h('div', { class: 'esq', style: 'height:120px;margin-top:12px' })]);
  let r;
  try { r = await api('apiFechamento', idEquipe, 'ver'); } catch (e) { return $('folha-corpo').replaceChildren(h('div', { class: 'erro' }, e.message)); }
  renderFechamento(idEquipe, r);
}

function renderFechamento(idEquipe, r) {
  const f = r.fechamento;
  const u = (E.dados && E.dados.usuario) || {};
  $('folha-titulo').textContent = '🏁 ' + r.equipe;
  $('folha-extra').replaceChildren(f && f.conceito ? badge(f.conceito) : '');
  const acao = async (btn, nome, txt, ok) => {
    btn.disabled = true; const t0 = btn.textContent; btn.textContent = txt;
    try { const x = await api('apiFechamento', idEquipe, nome); aviso(ok); renderFechamento(idEquipe, x); }
    catch (e) { aviso('Erro: ' + e.message, true); btn.disabled = false; btn.textContent = t0; }
  };
  const gerar = h('button', { class: 'btn ' + (f ? '' : 'btn-prim') }, f ? '🔄 Gerar de novo' : '🤖 Gerar o fechamento');
  gerar.addEventListener('click', () => acao(gerar, 'gerar', '⏳ A IA está escrevendo (até 1 min)…', '🏁 Fechamento gerado'));
  const enviar = f ? h('button', { class: 'btn btn-prim' }, '📨 Enviar aos professores') : null;
  if (enviar) enviar.addEventListener('click', () => acao(enviar, 'enviar', '⏳ Enviando…', '📨 Fechamento enviado aos professores'));
  const sec = (t, txt) => (txt ? [h('div', { class: 'titulo-secao' }, t), h('div', { class: 'caixa' }, txt)] : []);
  const texto = f ? ['FECHAMENTO DO CURSO — ' + r.equipe, f.conceito ? 'Conceito geral: ' + f.conceito : '', '',
    'Jornada:', ...r.linha.map((l) => '• ' + l.aula + ': ' + (l.conceito || l.situacao)), '', 'Resumo:', f.resumo, '', 'Evolução:', f.evolucao, '',
    'Pontos fortes:', f.pontosFortes, '', 'A desenvolver:', f.aDesenvolver, '', 'Recomendação final:', f.recomendacao].join('\n') : '';
  $('folha-corpo').replaceChildren(
    h('div', { class: 'titulo-secao' }, 'Jornada aula a aula'),
    h('ul', { class: 'hist' }, r.linha.map((l) => h('li', null, h('div', { class: 'linha' },
      h('div', null, h('div', { style: 'font-weight:700' }, l.aula), h('div', { class: 'sub' }, [l.checklist, l.atraso ? 'com atraso' : '', l.conceito ? '' : l.situacao].filter(Boolean).join(' · '))),
      badge(l.conceito))))),
    ...(f ? [...sec('Resumo', f.resumo), ...sec('Evolução', f.evolucao), ...sec('Pontos fortes', f.pontosFortes), ...sec('A desenvolver', f.aDesenvolver),
      ...sec('Recomendação final', f.recomendacao), h('div', { class: 'sub', style: 'margin-top:8px' }, 'Gerado em ' + f.geradoEm + ' · salvo na aba "Fechamento" da planilha')]
      : [h('div', { class: 'caixa', style: 'margin-top:12px' }, 'Ainda não gerado. A IA lê todas as análises e devolutivas da equipe e escreve o relatório final (sem notas).')]),
    h('div', { class: 'acoes-topo' }, gerar, enviar,
      f ? h('button', { class: 'btn', onclick: async () => { try { await navigator.clipboard.writeText(texto); aviso('Texto copiado'); } catch (e) { aviso('Não consegui copiar', true); } } }, '📋 Copiar texto') : null));
}

async function gerarTodosFechamentos(btn) {
  const eqs = (E.dados && E.dados.equipes) || [];
  btn.disabled = true;
  const falhas = [];
  for (let i = 0; i < eqs.length; i++) {
    btn.textContent = '⏳ ' + (i + 1) + '/' + eqs.length + ': ' + eqs[i].nome + '…';
    try { await api('apiFechamento', eqs[i].id, 'gerar'); } catch (e) { falhas.push(eqs[i].nome + ': ' + e.message); }
  }
  btn.disabled = false; btn.textContent = '🏁 Gerar o fechamento de todas as equipes';
  aviso('🏁 ' + (eqs.length - falhas.length) + ' fechamento(s) gerado(s). Veja no detalhe de cada equipe.' + (falhas.length ? '\n❌ ' + falhas.join('\n') : ''), falhas.length > 0);
}

/* ===== Aviso rápido ===== */
let tToast;
function aviso(txt, erro) {
  $('camada-toast').replaceChildren(h('div', { class: 'toast' + (erro ? ' erro-t' : ''), role: 'status' }, txt));
  clearTimeout(tToast); tToast = setTimeout(() => $('camada-toast').replaceChildren(), erro ? 6000 : 4000);
}

/* ===== Buscar entregas (Passo 3) ===== */
async function buscar() {
  const b = $('btn-buscar');
  b.disabled = true; b.textContent = '⏳ Buscando…';
  try {
    const r = await api('apiBuscarEntregas');
    aviso(r.mensagem);
    await carregar();
    sincronizarDriveSilencioso();
  } catch (e) {
    aviso('Erro: ' + e.message, true);
  } finally {
    b.disabled = false; b.textContent = '📥 Buscar entregas';
  }
}

/* ===== Possíveis entregas (fora do padrão) ===== */
async function carregarTriagem() {
  try { E.triagem = await api('apiTriagem'); } catch (e) { E.triagem = []; }
  renderTriagem();
}

/** Mostra os "Para confirmar" da aula selecionada (e os sem aula definida). */
function renderTriagem() {
  const todos = E.triagem || [];
  const aulaDe = (t) => { const e = E.dados && E.dados.entregas.find((x) => x.id === t.id); return e ? e.idAula : ''; };
  const daAula = todos.filter((t) => !aulaDe(t) || aulaDe(t) === E.aulaId);
  const itens = E.triagemTodas ? todos : daAula;
  const outras = todos.length - daAula.length;
  if (!todos.length) return $('triagem').replaceChildren();
  if (!itens.length) {
    return $('triagem').replaceChildren(h('div', { class: 'sub', style: 'margin-top:12px' }, '🟡 ' + outras + ' e-mail(s) para confirmar em outras aulas. ',
      h('button', { class: 'link-btn', onclick: () => { E.triagemTodas = true; renderTriagem(); } }, 'Ver')));
  }
  $('triagem').replaceChildren(h('div', { class: 'triagem' },
      h('div', { class: 'linha' }, h('h3', null, '🟡 Para confirmar (' + itens.length + ')' + (E.triagemTodas ? ' · todas as aulas' : '')),
        outras ? h('button', { class: 'link-btn', onclick: () => { E.triagemTodas = !E.triagemTodas; renderTriagem(); } },
          E.triagemTodas ? 'Só desta aula' : '+ ' + outras + ' de outras aulas') : null),
      h('div', { class: 'sub' }, 'E-mails com anexo ou link, mas com assunto fora do padrão (ou de remetente não cadastrado). É entrega?'),
      itens.map((t) => h('div', { class: 'tri-item' },
        h('div', { style: 'font-weight:700' }, t.equipe + (t.aula ? ' · ' + t.aula : '')),
        h('div', { class: 'sub' }, '“' + t.assunto + '”  ·  ' + t.remetente + '  ·  ' + t.enviadoEm),
        t.arquivos ? h('div', { class: 'sub' }, '📎 ' + t.arquivos) : null,
        t.avisos ? h('div', { class: 'sub' }, '⚠️ ' + t.avisos) : null,
        h('div', { class: 'botoes' },
          h('button', { class: 'btn btn-prim btn-peq', onclick: (ev) => decidir(ev, t.id, 'aceitar') }, '✅ É entrega'),
          h('button', { class: 'btn btn-peq', onclick: () => corrigir(t.id) }, '✏️ Escolher aula/equipe'),
          h('button', { class: 'btn btn-peq', onclick: (ev) => decidir(ev, t.id, 'ignorar') }, 'Ignorar'),
          t.link ? h('a', { class: 'btn btn-peq', href: t.link, target: '_blank', rel: 'noopener', style: 'text-decoration:none' }, '✉️ Ver e-mail') : null)))));
}

async function decidir(ev, id, decisao) {
  ev.target.disabled = true;
  try {
    await api('apiDecidirTriagem', id, decisao);
    aviso(decisao === 'aceitar' ? '✅ Entrega confirmada' : 'E-mail ignorado');
    await carregar();
    if (decisao === 'aceitar') sincronizarDriveSilencioso();
  } catch (e) {
    ev.target.disabled = false;
    aviso('Erro: ' + e.message, true);
  }
}

/* ===== Navegação ===== */
function irPara(aba) {
  E.aba = aba;
  document.querySelectorAll('.nav').forEach((b) => b.classList.toggle('ativo', b.dataset.aba === aba));
  $('v-painel').hidden = aba !== 'painel';
  $('v-aulas').hidden = aba !== 'aulas';
  $('v-equipes').hidden = aba !== 'equipes';
  $('v-ajustes').hidden = aba !== 'ajustes';
  $('v-agenda').hidden = aba !== 'agenda';
  $('filtro').hidden = aba !== 'painel';
  if (E.dados) render();
  window.scrollTo(0, 0);
}
document.querySelectorAll('.nav').forEach((b) => b.addEventListener('click', () => irPara(b.dataset.aba)));
$('sel-aula').addEventListener('change', (e) => { E.aulaId = e.target.value; E.triagemTodas = false; renderPainel(); });
$('btn-atualizar').addEventListener('click', atualizarTudo);
$('btn-buscar').addEventListener('click', buscar);
$('btn-analisar').addEventListener('click', analisar);
$('btn-fechar').addEventListener('click', fechar);
$('btn-nova-aula').addEventListener('click', () => editarAula(null));
$('btn-nova-equipe').addEventListener('click', () => editarEquipe(null));
$('fundo').addEventListener('click', fechar);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if ($('camada-modal').children.length) fecharModal(); else fechar(); } });
/* Atualiza sozinho a cada 60 s (para ver o que o outro fez), sem atrapalhar quem está editando. */
setInterval(() => {
  const ocupado = document.hidden || $('folha').classList.contains('aberta') || $('camada-modal').children.length || $('camada-carregando').children.length;
  if (!ocupado && (E.aba === 'painel' || E.aba === 'agenda')) carregar();
}, 60000);
carregar();
</script>
